<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>404</title>
<script>
// サイト全体で1枚だけ使われる 404。フォルダに自分の 404.html があれば、それを出す（元は別リポジトリだった名残。2026-11）
(function () {
  var own = ["nacha"];
  var top = (location.pathname.split("/")[1] || "");
  if (own.indexOf(top) < 0) return;
  fetch("/" + top + "/404.html").then(function (r) { return r.ok ? r.text() : null; }).then(function (h) {
    if (!h) return;
    h = h.replace(/(href|src)="(?!\/|https?:|#)/g, '$1="/' + top + '/');
    document.open(); document.write(h); document.close();
  });
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 sans-serif;text-align:center;background:#faf7f2;color:#2a2420}@media(prefers-color-scheme:dark){body{background:#1c1a17;color:#eee}}a{color:inherit}</style>
</head><body><main><h1>404</h1><p>このページは見つかりませんでした。</p><p><a href="/">トップへ</a></p></main></body></html>
