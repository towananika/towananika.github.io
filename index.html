<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="響とトライアスロンへのホーム。">
<title>HIBIKI | Home</title>
<style>
:root{color-scheme:light;--ink:#233b40;--muted:#53686c;--line:#d5e4e4;--accent:#226b87}*{box-sizing:border-box}body{margin:0;background:#fafdfc;color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Yu Gothic",sans-serif;letter-spacing:0}a{color:inherit}header,main,footer{max-width:1080px;margin:auto;padding-left:32px;padding-right:32px}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:750;text-decoration:none;font-size:20px}.mark{color:var(--muted);font-size:13px}main{padding-top:64px;padding-bottom:64px}h1{font-size:48px;line-height:1.15;margin:0 0 14px;font-weight:650}p{margin:0}.lead{color:var(--muted);margin-bottom:44px}.destinations{display:grid;grid-template-columns:1fr 1fr;gap:28px}.destination{border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;background:#fff;transition:transform .18s,border-color .18s}.destination:hover{transform:translateY(-3px);border-color:var(--accent)}a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.visual{height:220px;display:flex;align-items:center;justify-content:center;background:#e5f5f1;overflow:hidden}.monogram{font-size:90px;font-weight:500;color:#34716b}.visual img{width:100%;height:100%;object-fit:cover;object-position:center 55%}.copy{padding:28px}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:6px}h2{font-size:27px;line-height:1.4;margin:0 0 10px;overflow-wrap:anywhere}.description{color:var(--muted);font-size:15px;min-height:52px}.enter{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--accent);font-weight:600}.arrow{font-size:24px}footer{border-top:1px solid var(--line);padding-top:22px;padding-bottom:28px;color:var(--muted);font-size:12px}@media(max-width:640px){header,main,footer{padding-left:22px;padding-right:22px}header{height:76px}main{padding-top:38px;padding-bottom:40px}h1{font-size:38px}.lead{margin-bottom:28px}.destinations{grid-template-columns:1fr;gap:22px}.visual{height:170px}.copy{padding:22px}.description{min-height:0}}@media(prefers-reduced-motion:reduce){.destination{transition:none}.destination:hover{transform:none}}
.account{display:flex;align-items:center;gap:14px;min-width:0;font-size:13px}.account-name{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account button{background:transparent;border:1px solid var(--line);border-radius:5px;padding:7px 10px;color:var(--ink);font:inherit;cursor:pointer}.account [hidden]{display:none}#account-status{font-size:12px;color:var(--muted);margin-bottom:20px}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<header><a class="brand" href="./" aria-label="ホーム">HIBIKI</a><div class="account" aria-label="アカウント"><span class="account-name" id="account-name" hidden></span><a id="account-login" href="/triathlon/login/">ログイン</a><button id="account-logout" type="button" hidden>ログアウト</button></div></header>
<main>
<h1>HIBIKI</h1>
<p class="lead">日々のこと、つくる世界。</p>
<p id="account-status" role="status"></p>
<nav class="destinations" aria-label="ページを選ぶ">
<a class="destination" href="https://towananika.github.io/hibiki/">
<div class="visual" aria-hidden="true"><span class="monogram">響</span></div>
<div class="copy"><p class="eyebrow">LIFE</p><h2>響</h2><p class="description">暮らしと経験、これからの自分。</p><div class="enter"><span>響へ</span><span class="arrow" aria-hidden="true">&#8599;</span></div></div>
</a>
<a class="destination" href="https://towananika.github.io/triathlon/">
<div class="visual"><img src="https://towananika.github.io/triathlon/assets/aonami-keyvisual.png" alt="トライアスロンの世界" loading="eager"></div>
<div class="copy"><p class="eyebrow">WORLD</p><h2>TRIATHLON</h2><p class="description">人物と景色、想像から広がる人生。</p><div class="enter"><span>トライアスロンへ</span><span class="arrow" aria-hidden="true">&#8599;</span></div></div>
</a>
</nav>
</main>
<footer>HIBIKI / TRIATHLON</footer>
<script type="module" src="account.js"></script>
</body>
</html>
