<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="とわなにか。ひびきの暮らし、物語、道具、ファンサイトへの入口。">
<meta name="theme-color" content="#fafdfc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161c1d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23226b87'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E3%81%A8%3C/text%3E%3C/svg%3E">
<title>とわなにか</title>
<style>
:root{
  color-scheme:light dark;
  --ink:#233b40;
  --muted:#5c7175;
  --line:#d5e4e4;
  --accent:#226b87;
  --paper:#fafdfc;
  --card:#fff;
}
@media(prefers-color-scheme:dark){
  :root{
    --ink:#e3eeee;
    --muted:#9db1b3;
    --line:#2c3a3c;
    --accent:#7cc4dd;
    --paper:#161c1d;
    --card:#1e2627;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Yu Gothic",sans-serif}
a{color:inherit}
header,main,footer{max-width:760px;margin:auto;padding-left:20px;padding-right:20px}
header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
.brand{font-weight:750;text-decoration:none;font-size:18px;white-space:nowrap}
main{padding-top:40px;padding-bottom:48px}
h1{font-size:40px;line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:.04em}
.lead{color:var(--muted);margin:0 0 28px}

.sites{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0;padding:0;list-style:none}
.site{
  display:flex;align-items:center;gap:14px;height:100%;
  padding:16px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);text-decoration:none;
  transition:transform .15s,border-color .2s;
}
.site:hover{transform:translateY(-2px);border-color:var(--c)}
.site:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mark{
  flex:none;width:52px;height:52px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--c);color:#fff;font-size:24px;font-weight:700;line-height:1;
}
.name{display:block;font-weight:700;font-size:17px;line-height:1.35}
.desc{display:block;color:var(--muted);font-size:13px;line-height:1.5;margin-top:2px}
.main-site{grid-column:1/-1}
.main-site .mark{width:64px;height:64px;font-size:30px}
.main-site .name{font-size:20px}

.account{display:flex;align-items:center;gap:12px;min-width:0;font-size:13px}
.account-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--ink);font:inherit;cursor:pointer}
.account [hidden]{display:none}
#account-status{font-size:12px;color:var(--muted);margin:0 0 12px}
#account-status:empty{display:none}
footer{border-top:1px solid var(--line);padding-top:18px;padding-bottom:28px;color:var(--muted);font-size:12px}

@media(max-width:560px){
  h1{font-size:32px}
  main{padding-top:28px}
  .sites{grid-template-columns:1fr;gap:10px}
}
@media(prefers-reduced-motion:reduce){.site{transition:none}.site:hover{transform:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">とわなにか</a>
  <div class="account" aria-label="アカウント">
    <span class="account-name" id="account-name" hidden></span>
    <a id="account-login" href="/triathlon/login/">ログイン</a>
    <button id="account-logout" type="button" hidden>ログアウト</button>
  </div>
</header>

<main>
  <h1>とわなにか</h1>
  <p class="lead">暮らし、物語、道具の入口。</p>
  <p id="account-status" role="status"></p>

  <ul class="sites" aria-label="サイトを選ぶ">
    <li class="main-site"><a class="site" href="/hibiki/" style="--c:#4f8a6b">
      <span class="mark" aria-hidden="true">響</span>
      <span><span class="name">ひびき</span><span class="desc">健康・自由・愛。ひびきが幸せに育つための場所。</span></span>
    </a></li>
    <li><a class="site" href="/triathlon/" style="--c:#226b87">
      <span class="mark" aria-hidden="true">九</span>
      <span><span class="name">トライアスロン</span><span class="desc">九つの光の、一生。毎週連載の物語。</span></span>
    </a></li>
    <li><a class="site" href="/nacha/" style="--c:#b8392a">
      <span class="mark" aria-hidden="true">✦</span>
      <span><span class="name">ナチャ</span><span class="desc">小さな守護神の天空境内。</span></span>
    </a></li>
    <li><a class="site" href="/tool/" style="--c:#8a6a3b">
      <span class="mark" aria-hidden="true">間</span>
      <span><span class="name">間合い</span><span class="desc">暮らしの判断を数字にする道具箱。</span></span>
    </a></li>
    <li><a class="site" href="/hiyoko/" style="--c:#c99a12">
      <span class="mark" aria-hidden="true">ひ</span>
      <span><span class="name">HIYOKO</span><span class="desc">非公式ファンサイト。</span></span>
    </a></li>
    <li><a class="site" href="/remitech/" style="--c:#4a4f7a">
      <span class="mark" aria-hidden="true">R</span>
      <span><span class="name">REMITECH HUB</span><span class="desc">発信するものの元帳。</span></span>
    </a></li>
  </ul>
</main>

<footer>とわなにか · towananika.github.io</footer>

<script type="module" src="account.js"></script>
</body>
</html>
