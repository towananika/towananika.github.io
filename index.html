<!doctype html>
<html lang="ja" data-mood="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="響とトライアスロン、そして小さな守護神ナチャへのホーム。">
<title>HIBIKI | Home</title>
<style>
/* ---------- base ---------- */
:root{
  color-scheme:light;
  --ink:#233b40;
  --muted:#53686c;
  --line:#d5e4e4;
  --accent:#226b87;
  --paper:#fafdfc;
  --card:#fff;
  --visual:#e5f5f1;
  --monogram:#34716b;
  --morph:.55s;
}
html[data-mood="nacha"]{
  --ink:#3b211c;
  --muted:#7c5a50;
  --line:#e7cdb6;
  --accent:#b8392a;
  --paper:#fdf6ec;
  --card:#fffdf9;
  --visual:#f8e4d0;
  --monogram:#b8392a;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:16px/1.7 system-ui,-apple-system,"Yu Gothic",sans-serif;
  letter-spacing:0;
  transition:background-color var(--morph),color var(--morph);
}
a{color:inherit}
header,main,footer{max-width:1080px;margin:auto;padding-left:32px;padding-right:32px}
header{height:100px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);transition:border-color var(--morph)}
.brand{font-weight:750;text-decoration:none;font-size:20px;white-space:nowrap}
.brand-glyph{color:var(--accent)}
main{padding-top:64px;padding-bottom:64px}
h1{font-size:48px;line-height:1.15;margin:0 0 14px;font-weight:650;transition:color var(--morph)}
p{margin:0}
.lead{color:var(--muted);margin-bottom:44px}

/* ---------- destination cards ---------- */
.destinations{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.destination{
  display:block;width:100%;padding:0;text-align:left;font:inherit;color:inherit;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
  text-decoration:none;background:var(--card);cursor:pointer;
  transition:transform .18s,border-color .25s,background-color var(--morph),box-shadow .25s,opacity .35s;
}
.destination:hover{transform:translateY(-3px);border-color:var(--accent)}
a:focus-visible,button:focus-visible,.nacha-card:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.visual{height:220px;display:flex;align-items:center;justify-content:center;background:var(--visual);overflow:hidden;transition:background-color var(--morph)}
.monogram{font-size:90px;font-weight:500;color:var(--monogram);line-height:1;transition:color var(--morph),transform var(--morph)}
.visual img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.copy{padding:28px}
.eyebrow{color:var(--muted);font-size:12px;margin-bottom:6px}
h2{font-size:27px;line-height:1.4;margin:0 0 10px;overflow-wrap:anywhere}
.description{color:var(--muted);font-size:15px;min-height:52px}
.enter{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;transition:border-color var(--morph),color var(--morph)}
.arrow{font-size:24px}
footer{border-top:1px solid var(--line);padding-top:22px;padding-bottom:28px;color:var(--muted);font-size:12px;transition:border-color var(--morph)}

/* ---------- nacha card ---------- */
.nacha-card{appearance:none;-webkit-appearance:none}
.nacha-card .monogram{transition:transform var(--morph),color var(--morph)}
html[data-mood="nacha"] .nacha-card{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(184,57,42,.13),0 10px 24px rgba(184,57,42,.10);
}
html[data-mood="nacha"] .nacha-card .monogram{transform:rotate(12deg) scale(1.06)}
html[data-mood="nacha"] .destination:not(.nacha-card){opacity:.62}
html[data-mood="nacha"] .destination:not(.nacha-card):hover{opacity:1}

/* ---------- mood-dependent text ---------- */
.when-nacha{display:none}
html[data-mood="nacha"] .when-home{display:none}
html[data-mood="nacha"] .when-nacha{display:inline}
html[data-mood="nacha"] .brand-glyph{display:inline}

/* ---------- nacha call to action ---------- */
.cta-row{display:none;margin-top:34px}
html[data-mood="nacha"] .cta-row{display:block}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  padding:13px 22px;border-radius:999px;
  background:var(--accent);color:#fff;text-decoration:none;font-weight:650;
  transition:transform .18s,background-color var(--morph);
}
.cta:hover{transform:translateY(-2px)}

/* ---------- petals ---------- */
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.petal{position:absolute;top:-6vh;width:9px;height:9px;border-radius:50% 0 50% 50%;background:linear-gradient(135deg,#f3b6a6,#c0392b);opacity:.5;animation:petal-fall linear forwards}
@keyframes petal-fall{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  10%{opacity:.55}
  100%{transform:translate3d(var(--drift,0px),112vh,0) rotate(var(--spin,420deg));opacity:0}
}

/* ---------- width ---------- */
@media(max-width:900px){
  header,main,footer{padding-left:22px;padding-right:22px}
  header{height:76px}
  main{padding-top:38px;padding-bottom:40px}
  h1{font-size:38px}
  .lead{margin-bottom:28px}
  .destinations{grid-template-columns:1fr;gap:22px}
  .visual{height:170px}
  .copy{padding:22px}
  .description{min-height:0}
}
@media(prefers-reduced-motion:reduce){
  .destination,.cta,.monogram{transition:none}
  .destination:hover,.cta:hover{transform:none}
  .petals{display:none}
  html[data-mood="nacha"] .nacha-card .monogram{transform:none}
}

/* ---------- account ---------- */
.account{display:flex;align-items:center;gap:14px;min-width:0;font-size:13px}
.account-name{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account button{background:transparent;border:1px solid var(--line);border-radius:5px;padding:7px 10px;color:var(--ink);font:inherit;cursor:pointer}
.account [hidden]{display:none}
#account-status{font-size:12px;color:var(--muted);margin-bottom:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<header>
  <a class="brand" href="./" aria-label="ホーム">HIBIKI<span class="brand-glyph when-nacha" aria-hidden="true"> ✦</span></a>
  <div class="account" aria-label="アカウント">
    <span class="account-name" id="account-name" hidden></span>
    <a id="account-login" href="/triathlon/login/">ログイン</a>
    <button id="account-logout" type="button" hidden>ログアウト</button>
  </div>
</header>

<main>
<h1>HIBIKI</h1>
<p class="lead">
  <span class="when-home">日々のこと、つくる世界。</span>
  <span class="when-nacha">小さな守護神が、そっと寄り添う場所。</span>
</p>
<p id="account-status" role="status"></p>

<nav class="destinations" aria-label="ページを選ぶ">
  <a class="destination" href="https://towananika.github.io/hibiki/">
    <div class="visual" aria-hidden="true"><span class="monogram">響</span></div>
    <div class="copy">
      <p class="eyebrow">LIFE</p>
      <h2>響</h2>
      <p class="description">暮らしと経験、これからの自分。</p>
      <div class="enter"><span>響へ</span><span class="arrow" aria-hidden="true">&#8599;</span></div>
    </div>
  </a>

  <a class="destination" href="https://towananika.github.io/triathlon/">
    <div class="visual"><img src="https://towananika.github.io/triathlon/assets/aonami-keyvisual.png" alt="トライアスロンの世界" loading="eager"></div>
    <div class="copy">
      <p class="eyebrow">WORLD</p>
      <h2>TRIATHLON</h2>
      <p class="description">人物と景色、想像から広がる人生。</p>
      <div class="enter"><span>トライアスロンへ</span><span class="arrow" aria-hidden="true">&#8599;</span></div>
    </div>
  </a>

  <div class="destination nacha-card" role="button" tabindex="0" id="nacha-toggle" aria-pressed="false">
    <div class="visual" aria-hidden="true"><span class="monogram">✦</span></div>
    <div class="copy">
      <p class="eyebrow">
        <span class="when-home">SPIRIT</span>
        <span class="when-nacha">NACHA MODE</span>
      </p>
      <h2>ナチャ</h2>
      <p class="description">
        <span class="when-home">小さな守護神と、三柱の仲間たち。</span>
        <span class="when-nacha">いま、このページはナチャの仕様です。</span>
      </p>
      <div class="enter">
        <span class="when-home">ナチャ仕様に変わる</span>
        <span class="when-nacha">ホームに戻る</span>
        <span class="arrow" aria-hidden="true"><span class="when-home">✦</span><span class="when-nacha">&#8617;</span></span>
      </div>
    </div>
  </div>
</nav>

<p class="cta-row"><a class="cta" href="https://towananika.github.io/nacha/">ナチャの境内へ <span aria-hidden="true">&#8599;</span></a></p>

<p id="nacha-status" class="sr-only" role="status" aria-live="polite"></p>
</main>

<footer>
  <span class="when-home">HIBIKI / TRIATHLON</span>
  <span class="when-nacha">NACHA / 小さな守護神 ナチャ</span>
</footer>

<script type="module" src="account.js"></script>
<script>
(function () {
  var root = document.documentElement;
  var toggle = document.getElementById('nacha-toggle');
  var petals = document.getElementById('petals');
  var status = document.getElementById('nacha-status');
  var baseTitle = document.title;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function clearPetals() {
    while (petals.firstChild) petals.removeChild(petals.firstChild);
  }

  function spawnPetals() {
    if (reduce.matches) return;
    clearPetals();
    var count = 16;
    for (var i = 0; i < count; i++) {
      var p = document.createElement('span');
      p.className = 'petal';
      p.style.left = (Math.random() * 100).toFixed(2) + 'vw';
      p.style.width = p.style.height = (6 + Math.random() * 7).toFixed(1) + 'px';
      p.style.setProperty('--drift', (Math.random() * 160 - 80).toFixed(0) + 'px');
      p.style.setProperty('--spin', (240 + Math.random() * 480).toFixed(0) + 'deg');
      p.style.animationDuration = (6 + Math.random() * 6).toFixed(2) + 's';
      p.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      petals.appendChild(p);
      p.addEventListener('animationend', function () { this.remove(); });
    }
  }

  function apply(on) {
    root.setAttribute('data-mood', on ? 'nacha' : 'home');
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    document.title = on ? 'ナチャ | 小さな守護神' : baseTitle;
    if (on) {
      spawnPetals();
      status.textContent = 'ナチャ仕様に変わりました。';
    } else {
      clearPetals();
      status.textContent = 'ホーム表示に戻りました。';
    }
  }

  toggle.addEventListener('click', function () {
    apply(root.getAttribute('data-mood') !== 'nacha');
  });

  // role="button" は Enter / Space を自前で扱う
  toggle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      toggle.click();
    }
  });

  // Esc でホーム表示に戻す
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && root.getAttribute('data-mood') === 'nacha') {
      apply(false);
      toggle.focus();
    }
  });
})();
</script>
</body>
</html>
