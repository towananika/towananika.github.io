<main id="main">
<nav class="crumbs"><a href="/">Towananika</a> ／ <a href="../">HIYOKO</a> ／ <a href="../analysis/">SNS分析</a> ／ KPI一覧</nav>
<h1>📋 KPI一覧</h1>
<div class="kp">
 <div class="kp-top">
  <div class="kp-seg" role="group" aria-label="SNSを選ぶ"><button data-s="x">X</button><button data-s="ig">Instagram</button></div>
  <div class="kp-seg" role="group" aria-label="期間"><button data-p="30">1ヶ月</button><button data-p="91">3ヶ月</button><button data-p="182">6ヶ月</button><button data-p="0">全期間</button></div>
  <div class="kp-seg kp-view" role="group" aria-label="見かた"><button data-v="g">🖼 画像で見る</button><button data-v="l">☰ リスト</button></div>
 </div>
 <label class="kp-sel"><span>並べ順</span><select id="kp-sort"></select></label>
 <nav class="kp-pages" aria-label="ページ送り"><div class="kp-pager" data-pager></div><label>ページ <select id="kp-jump"></select></label></nav>
 <ol class="kp-list" id="kp-list" tabindex="-1"></ol>
 <nav class="kp-pages" aria-label="ページ送り"><div class="kp-pager" data-pager></div></nav>
 <span id="kp-status" class="kp-status" role="status" aria-live="polite"></span>
</div>
<!--smap--><!--/smap-->
<script>
(function(){
const D=__KPI__;
// X: [date,text,link,imp,likes,replies,reposts,bookmarks,pv,urlclicks,eng]  IG: [date,text,link,views,reach,likes,comments,shares,saves,follows,type]
const F={x:{
  re:p=>p[4]+p[5]+p[6]+p[7], base:p=>p[3],
  cols:[['表示',p=>p[3]],['反応',p=>p[4]+p[5]+p[6]+p[7]],['反応率',null],['いいね',p=>p[4]],['返信',p=>p[5]],['リポスト',p=>p[6]],['保存',p=>p[7]],['プロフィール訪問',p=>p[8]],['リンクのクリック',p=>p[9]],['フォロー',p=>p[11]],['エンゲージメント',p=>p[10]]],
  sorts:[['基本',[['新しい順','new'],['フォローが多い順','フォロー'],['反応が多い順','反応'],['反応率が高い順','反応率'],['表示が多い順','表示']]],['反応ごと',[['❤️ いいねが多い順','いいね'],['💬 返信が多い順','返信'],['🔁 リポストが多い順','リポスト'],['🔖 保存が多い順','保存']]],['反応詳細',[['➕ フォローが多い順','フォロー'],['🔗 リンクのクリックが多い順','リンクのクリック'],['👤 プロフィール訪問が多い順','プロフィール訪問'],['📊 エンゲージメントが多い順','エンゲージメント']]]],
  def:'<b>表示</b>：投稿が画面に出た回数。<b>反応</b>：いいね＋返信＋リポスト＋保存。<b>反応率</b>：反応÷表示。<b>エンゲージメント</b>：X Analytics が記録した投稿への操作の合計（いいね・返信などの「反応」とは集計範囲が異なります）。<b>プロフィール訪問</b>：その投稿からアカウントのページを開いた回数。<b>リンクのクリック</b>：投稿内のリンクが押された回数。<b>フォロー</b>：その投稿からフォローした人（X が投稿に結びつけた分だけ。アカウント全体のフォロー数より少なくなります）。返信には自分のスレッドの返信もふくまれます。出典：X Analytics の投稿別の書き出し。'},
 ig:{
  re:p=>p[5]+p[6]+p[7]+p[8], base:p=>p[4],
  cols:[['表示',p=>p[3]],['リーチ',p=>p[4]],['反応',p=>p[5]+p[6]+p[7]+p[8]],['反応率',null],['いいね',p=>p[5]],['コメント',p=>p[6]],['シェア',p=>p[7]],['保存',p=>p[8]],['フォロー',p=>p[9]]],
  sorts:[['基本',[['新しい順','new'],['フォローが多い順','フォロー'],['反応が多い順','反応'],['反応率が高い順','反応率'],['表示が多い順','表示'],['リーチが多い順','リーチ']]],['反応ごと',[['❤️ いいねが多い順','いいね'],['💬 コメントが多い順','コメント'],['📤 シェアが多い順','シェア'],['🔖 保存が多い順','保存']]]],
  def:'<b>表示</b>：投稿が見られた回数。<b>リーチ</b>：見た人の数。<b>反応</b>：いいね＋コメント＋シェア＋保存。<b>反応率</b>：反応÷リーチ。<b>シェア</b>：送られた回数。<b>フォロー</b>：その投稿を見てフォローした人。出典：Instagram インサイトの投稿別の書き出し。'}};
let s='x',per=91,so='new',view='g',page=1,size=12;
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
function emb(p){if(s==='ig'){const u=p[2].replace(/\/?$/,'/');return u+'embed/'}const id=(p[2].match(/status\/(\d+)/)||[])[1];return id?`https://platform.twitter.com/embed/Tweet.html?id=${id}&theme=${dark?'dark':'light'}&dnt=true&hideThread=true&lang=ja`:''}
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ja-JP');
const md=d=>{const p=d.split('-');return `${+p[0]}/${+p[1]}/${+p[2]}`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=100;
// SNSの画面に近い並びと、すべての反応詳細
const BD={x:{basic:[['💬','返信',p=>p[5]],['🔁','リポスト',p=>p[6]],['❤️','いいね',p=>p[4]],['👁','表示',p=>p[3]]],
  detail:[['➕','フォロー',p=>p[11]],['🔗','リンクのクリック',p=>p[9]],['👤','プロフィール訪問',p=>p[8]],['🔖','保存',p=>p[7]],['📊','エンゲージメント',p=>p[10]]]},
 ig:{basic:[['❤️','いいね',p=>p[5]],['💬','コメント',p=>p[6]],['📤','シェア',p=>p[7]],['🔖','保存',p=>p[8]]],
  detail:[['❤️','いいね',p=>p[5]],['💬','コメント',p=>p[6]],['📤','シェア',p=>p[7]],['🔖','保存',p=>p[8]],['➕','フォロー',p=>p[9]]]}};
const descriptions={x:{'表示':'投稿が画面に表示された回数','返信':'投稿への返信数（自分のスレッドの返信を含む）','リポスト':'投稿がリポストされた回数','いいね':'投稿へのいいね数','保存':'投稿が保存された回数','フォロー':'この投稿からフォローした人の数（Xが投稿に結びつけた分）','プロフィール訪問':'この投稿からプロフィールを開いた回数','リンクのクリック':'投稿内のリンクがクリックされた回数','エンゲージメント':'X Analyticsが記録した投稿への操作の合計。反応とは集計範囲が異なります','反応':'いいね・返信・リポスト・保存の合計','反応率':'反応を表示回数で割った割合'},ig:{'表示':'投稿が見られた回数','リーチ':'投稿を見た人の数','いいね':'投稿へのいいね数','コメント':'投稿へのコメント数','シェア':'投稿がシェアされた回数','保存':'投稿が保存された回数','フォロー':'この投稿を見てフォローした人の数','反応':'いいね・コメント・シェア・保存の合計','反応率':'反応をリーチで割った割合'}};
const hint=l=>` tabindex="0" data-tip="${esc(descriptions[s][l]||l)}" aria-label="${esc(l+'：'+(descriptions[s][l]||l))}"`;
const chip=([ic,l,g],p)=>{const v=g(p);return `<span${hint(l)} class="bd${v?'':' z'}${l===so?' on':''}"><i aria-hidden="true">${ic}</i>${l}<b>${fmt(v)}</b></span>`};
const bd=p=>`<div class="bdw"><div class="bdr"><span class="bdh">反応詳細</span>${BD[s].detail.filter(c=>!BD[s].basic.some(b=>b[1]===c[1])).map(c=>chip(c,p)).join('')}</div></div>`;
function rate(p){const b=F[s].base(p);return b?F[s].re(p)/b:0}
function val(p,k){if(k==='反応率')return rate(p);const c=F[s].cols.find(c=>c[0]===k);return c[1](p)}
function list(){const L=D[s],last=L[0][0],st=per?new Date(new Date(last+'T00:00:00Z').getTime()-(per-1)*864e5).toISOString().slice(0,10):'0';
 let P=L.filter(p=>p[0]>=st);const all=P.length;
 if(so==='反応率')P=P.filter(p=>F[s].base(p)>=MIN);
 if(so!=='new')P=P.slice().sort((a,b)=>val(b,so)-val(a,so)||(a[0]<b[0]?1:-1));
 return {P,all,st,last}}
function draw(){const f=F[s];if(!f.sorts.flatMap(g=>g[1]).some(x=>x[1]===so))so='new';const {P,all,st,last}=list();
 document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));
 document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===per));
 const flat=f.sorts.flatMap(g=>g[1]);if(!flat.some(x=>x[1]===so))so='new';
 $('kp-sort').innerHTML=f.sorts.map(([g,L])=>`<optgroup label="${g}">${L.map(x=>`<option value="${x[1]}"${x[1]===so?' selected':''}>${x[0]}</option>`).join('')}</optgroup>`).join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
 $('kp-list').className='kp-list'+(view==='g'?' kp-grid':'');
 const pages=Math.max(1,Math.ceil(P.length/size));page=Math.min(page,pages);const visible=P.slice((page-1)*size,page*size);
 if(view==='g'){$('kp-list').innerHTML=visible.map((p,j)=>`<li><div class="pv"><span class="pv-loading">読み込み中…</span><iframe src="${emb(p)}" loading="lazy" title="投稿のプレビュー" scrolling="no" allowtransparency="true" onload="this.previousElementSibling.hidden=true"></iframe></div><div class="h"><span class="n">${(page-1)*size+j+1}</span><span class="d">${md(p[0])}${s==='ig'?' · '+p[10]:''}</span><a href="${p[2]}" target="_blank" rel="noopener">開く ↗</a></div><dl>${BD[s].basic.map(([ic,l,g])=>`<div class="${l===so?'on':''}"><dt${hint(l)}>${ic} ${l}</dt><dd>${fmt(g(p))}</dd></div>`).join('')}</dl>${bd(p)}</li>`).join('')||'<li class="e">この期間の投稿はありません</li>'}
 else $('kp-list').innerHTML=visible.map((p,j)=>`<li><div class="h"><span class="n">${(page-1)*size+j+1}</span><span class="d">${md(p[0])}${s==='ig'?' · '+p[10]:''}</span><a href="${p[2]}" target="_blank" rel="noopener">開く ↗</a></div><p class="t">${esc(p[1])||'<span class="e">（テキストなし）</span>'}</p><dl>${f.cols.map(([l,g])=>{const v=l==='反応率'?(rate(p)*100).toFixed(1)+'%':fmt(g(p));return `<div class="${l===so?'on':''}"><dt${hint(l)}>${l}</dt><dd>${v}</dd></div>`}).join('')}</dl></li>`).join('')||'<li class="e">この期間の投稿はありません</li>';
 const nums=[...new Set([1, page-1, page, page+1, pages].filter(n=>n>=1&&n<=pages))].sort((a,b)=>a-b);
 const numbers=nums.map((n,i)=>`${i&&n-nums[i-1]>1?'<span class="kp-ellipsis" aria-hidden="true">…</span>':''}<button type="button" data-page="${n}" aria-label="${n}ページ"${n===page?' aria-current="page"':''}>${n}</button>`).join('');
 document.querySelectorAll('[data-pager]').forEach(el=>{el.innerHTML=`<button type="button" data-move="prev"${page===1?' disabled':''}>前へ</button><span class="kp-numbers">${numbers}</span><button type="button" data-move="next"${page===pages?' disabled':''}>次へ</button>`});
 $('kp-jump').innerHTML=Array.from({length:pages},(_,i)=>`<option value="${i+1}"${i+1===page?' selected':''}>${i+1}</option>`).join('');
 $('kp-status').textContent=P.length?`${(page-1)*size+1}–${Math.min(page*size,P.length)} / ${P.length}`:'0 / 0';
 try{history.replaceState(null,'','#'+s)}catch(e){}}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{s=b.dataset.s;page=1;draw()});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{per=+b.dataset.p;page=1;draw()});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;page=1;draw()});
$('kp-sort').onchange=e=>{so=e.target.value;page=1;draw()};
$('kp-jump').onchange=e=>{page=+e.target.value;draw();$('kp-list').scrollIntoView({block:'start'});$('kp-list').focus({preventScroll:true})};
document.querySelectorAll('[data-pager]').forEach(el=>el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page)page=+b.dataset.page;else if(b.dataset.move)page+=b.dataset.move==='next'?1:-1;else return;draw();$('kp-list').scrollIntoView({block:'start'});$('kp-list').focus({preventScroll:true})}));
const tip=document.createElement('div');tip.className='kp-tip';tip.id='kp-tip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);
function showTip(el){tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-tip.offsetHeight-8))+'px';el.setAttribute('aria-describedby','kp-tip')}
function hideTip(){tip.hidden=true;document.querySelectorAll('[aria-describedby="kp-tip"]').forEach(el=>el.removeAttribute('aria-describedby'))}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el&&e.pointerType==='mouse')showTip(el)});
document.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&e.target.closest('[data-tip]'))hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-tip]'))hideTip()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);else hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
if(location.hash==='#ig')s='ig';
draw();
})();
</script>
</main>
