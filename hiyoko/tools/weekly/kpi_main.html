<main id="main">
<nav class="crumbs"><a href="/">Towananika</a> ／ <a href="../">HIYOKO</a> ／ <a href="../analysis/">SNS分析</a> ／ KPI一覧</nav>
<h1>📋 KPI一覧</h1>
<div class="kp">
 <div class="kp-top">
  <div class="kp-seg" role="group" aria-label="SNSを選ぶ"><button data-s="x">X</button><button data-s="ig">Instagram</button></div>
  <div class="kp-seg" role="group" aria-label="期間"><button data-p="30">1ヶ月</button><button data-p="91">3ヶ月</button><button data-p="182">6ヶ月</button><button data-p="0">全期間</button></div>
 </div>
 <div class="kp-seg kp-view" role="group" aria-label="見かた"><button data-v="g">🖼 画像で見る</button><button data-v="l">☰ リスト</button></div>
 <label class="kp-sel"><span>並べ順</span><select id="kp-sort"></select></label>
 <div class="kp-sum" id="kp-sum"></div>
 <ol class="kp-list" id="kp-list"></ol>
 <button class="kp-more" id="kp-more">もっと見る</button>
 <details class="kp-def"><summary>それぞれの数字の意味</summary><div id="kp-def"></div></details>
</div>
<!--smap--><!--/smap-->
<script>
(function(){
const D=__KPI__;
// X: [date,text,link,imp,likes,replies,reposts,bookmarks,pv,urlclicks,eng]  IG: [date,text,link,views,reach,likes,comments,shares,saves,follows,type]
const F={x:{
  re:p=>p[4]+p[5]+p[6]+p[7], base:p=>p[3],
  cols:[['表示',p=>p[3]],['反応',p=>p[4]+p[5]+p[6]+p[7]],['反応率',null],['いいね',p=>p[4]],['返信',p=>p[5]],['リポスト',p=>p[6]],['保存',p=>p[7]],['プロフィール訪問',p=>p[8]],['リンクのクリック',p=>p[9]],['フォロー',p=>p[11]]],
  sorts:[['基本',[['新しい順','new'],['フォローが多い順','フォロー'],['反応が多い順','反応'],['反応率が高い順','反応率'],['表示が多い順','表示']]],['反応ごと',[['❤️ いいねが多い順','いいね'],['💬 返信が多い順','返信'],['🔁 リポストが多い順','リポスト'],['🔖 保存が多い順','保存']]],['フォローにつながる行動',[['➕ フォローが多い順','フォロー'],['👤 プロフィール訪問が多い順','プロフィール訪問'],['🔗 リンクのクリックが多い順','リンクのクリック']]]],
  sum:[['投稿',p=>1],['表示',p=>p[3]],['反応',p=>p[4]+p[5]+p[6]+p[7]],['フォロー',p=>p[11]]],
  def:'<b>表示</b>：投稿が画面に出た回数。<b>反応</b>：いいね＋返信＋リポスト＋保存。<b>反応率</b>：反応÷表示。<b>プロフィール訪問</b>：その投稿からアカウントのページを開いた回数。<b>リンクのクリック</b>：投稿内のリンクが押された回数。<b>フォロー</b>：その投稿からフォローした人（X が投稿に結びつけた分だけ。アカウント全体のフォロー数より少なくなります）。返信には自分のスレッドの返信もふくまれます。出典：X Analytics の投稿別の書き出し。'},
 ig:{
  re:p=>p[5]+p[6]+p[7]+p[8], base:p=>p[4],
  cols:[['表示',p=>p[3]],['リーチ',p=>p[4]],['反応',p=>p[5]+p[6]+p[7]+p[8]],['反応率',null],['いいね',p=>p[5]],['コメント',p=>p[6]],['シェア',p=>p[7]],['保存',p=>p[8]],['フォロー',p=>p[9]]],
  sorts:[['基本',[['新しい順','new'],['フォローが多い順','フォロー'],['反応が多い順','反応'],['反応率が高い順','反応率'],['表示が多い順','表示'],['リーチが多い順','リーチ']]],['反応ごと',[['❤️ いいねが多い順','いいね'],['💬 コメントが多い順','コメント'],['📤 シェアが多い順','シェア'],['🔖 保存が多い順','保存']]]],
  sum:[['投稿',p=>1],['表示',p=>p[3]],['反応',p=>p[5]+p[6]+p[7]+p[8]],['フォロー',p=>p[9]]],
  def:'<b>表示</b>：投稿が見られた回数。<b>リーチ</b>：見た人の数。<b>反応</b>：いいね＋コメント＋シェア＋保存。<b>反応率</b>：反応÷リーチ。<b>シェア</b>：送られた回数。<b>フォロー</b>：その投稿を見てフォローした人。出典：Instagram インサイトの投稿別の書き出し。'}};
let s='x',per=91,so='new',view='g',shown=24;
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
function emb(p){if(s==='ig'){const u=p[2].replace(/\/?$/,'/');return u+'embed/'}const id=(p[2].match(/status\/(\d+)/)||[])[1];return id?`https://platform.twitter.com/embed/Tweet.html?id=${id}&theme=${dark?'dark':'light'}&dnt=true&hideThread=true&lang=ja`:''}
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ja-JP');
const md=d=>{const p=d.split('-');return `${+p[0]}/${+p[1]}/${+p[2]}`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=100;
// 反応の内わけ（アイコンと名前）と、フォローにつながる行動
const BD={x:{re:[['❤️','いいね',p=>p[4]],['💬','返信',p=>p[5]],['🔁','リポスト',p=>p[6]],['🔖','保存',p=>p[7]]],
  fo:[['➕','フォロー',p=>p[11]],['👤','プロフィール訪問',p=>p[8]],['🔗','リンクのクリック',p=>p[9]]]},
 ig:{re:[['❤️','いいね',p=>p[5]],['💬','コメント',p=>p[6]],['📤','シェア',p=>p[7]],['🔖','保存',p=>p[8]]],
  fo:[['➕','フォロー',p=>p[9]]]}};
const chip=([ic,l,g],p)=>{const v=g(p);return `<span class="bd${v?'':' z'}${l===so?' on':''}"><i aria-hidden="true">${ic}</i>${l}<b>${fmt(v)}</b></span>`};
const bd=p=>`<div class="bdw"><div class="bdr"><span class="bdh">反応の内わけ</span>${BD[s].re.map(c=>chip(c,p)).join('')}</div><div class="bdr"><span class="bdh">フォローにつながる行動</span>${BD[s].fo.map(c=>chip(c,p)).join('')}</div></div>`;
function rate(p){const b=F[s].base(p);return b?F[s].re(p)/b:0}
function val(p,k){if(k==='反応率')return rate(p);const c=F[s].cols.find(c=>c[0]===k);return c[1](p)}
function list(){const L=D[s],last=L[0][0],st=per?new Date(new Date(last+'T00:00:00Z').getTime()-(per-1)*864e5).toISOString().slice(0,10):'0';
 let P=L.filter(p=>p[0]>=st);const all=P.length;
 if(so==='反応率')P=P.filter(p=>F[s].base(p)>=MIN);
 if(so!=='new')P=P.slice().sort((a,b)=>val(b,so)-val(a,so)||(a[0]<b[0]?1:-1));
 return {P,all,st,last}}
function draw(){const f=F[s];if(!f.sorts.flatMap(g=>g[1]).some(x=>x[1]===so))so='new';const {P,all,st,last}=list();
 document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));
 document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===per));
 const flat=f.sorts.flatMap(g=>g[1]);if(!flat.some(x=>x[1]===so))so='new';
 $('kp-sort').innerHTML=f.sorts.map(([g,L])=>`<optgroup label="${g}">${L.map(x=>`<option value="${x[1]}"${x[1]===so?' selected':''}>${x[0]}</option>`).join('')}</optgroup>`).join('');
 const from=per?st:D[s][D[s].length-1][0];
  const base=L=>L;const S=list().P;const src=so==='反応率'?D[s].filter(p=>p[0]>=st):S;
 $('kp-sum').innerHTML=f.sum.map(([l,g])=>`<div><b>${fmt(src.reduce((a,p)=>a+g(p),0))}</b><span>${l}${l==='投稿'?'':'（合計）'}</span></div>`).join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
 $('kp-list').className='kp-list'+(view==='g'?' kp-grid':'');
 const key=(p,l)=>{const c=f.cols.find(c=>c[0]===l);return l==='反応率'?(rate(p)*100).toFixed(1)+'%':fmt(c[1](p))};
 const k3=[...new Set([so==='new'?'表示':so,'表示','反応','反応率'])].slice(0,3);
 if(view==='g'){$('kp-list').innerHTML=P.slice(0,shown).map((p,j)=>`<li><div class="pv"><iframe src="${emb(p)}" loading="lazy" title="投稿のプレビュー" scrolling="no" allowtransparency="true"></iframe></div><div class="h"><span class="n">${j+1}</span><span class="d">${md(p[0])}${s==='ig'?' · '+p[10]:''}</span><a href="${p[2]}" target="_blank" rel="noopener">開く ↗</a></div><dl>${k3.map(l=>`<div class="${l===so?'on':''}"><dt>${l}</dt><dd>${key(p,l)}</dd></div>`).join('')}</dl>${bd(p)}</li>`).join('')||'<li class="e">この期間の投稿はありません</li>'}
 else $('kp-list').innerHTML=P.slice(0,shown).map((p,j)=>`<li><div class="h"><span class="n">${j+1}</span><span class="d">${md(p[0])}${s==='ig'?' · '+p[10]:''}</span><a href="${p[2]}" target="_blank" rel="noopener">開く ↗</a></div><p class="t">${esc(p[1])||'<span class="e">（テキストなし）</span>'}</p><dl>${f.cols.map(([l,g])=>{const v=l==='反応率'?(rate(p)*100).toFixed(1)+'%':fmt(g(p));return `<div class="${l===so?'on':''}"><dt>${l}</dt><dd>${v}</dd></div>`}).join('')}</dl></li>`).join('')||'<li class="e">この期間の投稿はありません</li>';
 $('kp-more').hidden=P.length<=shown;$('kp-more').textContent=`もっと見る（残り${fmt(P.length-shown)}本）`;
 $('kp-def').innerHTML=f.def;
 try{history.replaceState(null,'','#'+s)}catch(e){}}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{s=b.dataset.s;shown=24;draw()});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{per=+b.dataset.p;shown=24;draw()});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;shown=24;draw()});
$('kp-sort').onchange=e=>{so=e.target.value;shown=24;draw()};
$('kp-more').onclick=()=>{shown+=24;draw()};
if(location.hash==='#ig')s='ig';
draw();
})();
</script>
</main>
