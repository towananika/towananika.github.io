<link rel="stylesheet" href="../../../style.css?v=4c84c5bc">
<style>
.rpt-list{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;margin:0 0 16px}
.rpt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .12s}
.rpt-row:last-child{border-bottom:0}
.rpt-row:hover{background:var(--paper)}
.rpt-row-title{font-size:.95rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rpt-row:hover .rpt-row-title{color:var(--accent)}
.rpt-row-meta{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.rpt-by{display:inline-flex;align-items:center;gap:4px;max-width:12em;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.rpt-ai{font-size:.66rem;font-weight:700;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);line-height:1.5}
.rpt-empty{padding:16px;color:var(--muted)}
@media(max-width:520px){.rpt-row{flex-direction:column;align-items:flex-start;gap:4px}.rpt-row-title{white-space:normal;width:100%}}
.rpt-pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:0 0 32px}
.rpt-page-btn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.rpt-page-btn:hover{border-color:var(--accent);color:var(--accent)}
.rpt-page-btn[aria-current]{background:var(--accent);color:#fff;border-color:var(--accent)}
.rpt-page-info{font-size:.8rem;color:var(--muted);margin-left:6px}
.rpt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rpt-head[hidden],[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:4px;font:inherit;cursor:pointer;border-radius:8px;padding:8px 16px;font-size:.88rem;border:1px solid transparent;text-decoration:none}
.btn-ghost{background:none;color:var(--accent);border-color:var(--accent)}
.btn-ghost:hover{background:var(--accent);color:#fff}
.btn-sm{padding:4px 10px;font-size:.78rem;border-radius:6px}
.btn-danger{background:none;color:#c0392b;border-color:#c0392b}
.rpt-detail{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px 22px;margin:0 0 32px}
.rpt-detail-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.rpt-detail-title{font-size:1.22rem;font-weight:700;color:var(--ink);margin:0 0 8px;line-height:1.4}
.rpt-detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);margin-bottom:16px}
.rpt-detail-body{font-size:.94rem;line-height:1.75;color:var(--ink);overflow-wrap:anywhere}
.rpt-detail-body h3{font-size:1.02rem;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rpt-detail-body h4{font-size:.95rem;margin:14px 0 4px}
.rpt-row-wrap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.rpt-row-wrap:last-child{border-bottom:0}
.rpt-row-wrap .rpt-row{flex:1;min-width:0;border-bottom:0}
.rpt-row-tools{display:inline-flex;gap:6px;padding:0 12px 0 0;flex:none}
.rpt-detail-body .tbl{overflow-x:auto;margin:8px 0 12px}
.rpt-detail-body th,.rpt-detail-body td{white-space:nowrap;font-variant-numeric:tabular-nums}
.rpt-fold{border-top:1px solid var(--line);margin:10px 0}
.rpt-fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.rpt-fold>summary::-webkit-details-marker{display:none}
.rpt-fold>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:700}
.rpt-fold[open]>summary::after{content:"－"}
.rpt-fold>summary h3{border:0!important;margin:12px 0!important;padding:0!important}
.rpt-detail-body a.rpt-jump{font-weight:inherit}
.rpt-detail-body a.rpt-jump::after{content:" ›"}
@keyframes rptHit{0%,60%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.rpt-hit{animation:rptHit 3s ease-out;border-radius:6px;box-shadow:-8px 0 0 0 color-mix(in srgb,var(--accent) 22%,transparent)}
.rpt-detail-body h4[id],.rpt-detail-body h3[id]{scroll-margin-top:80px}
.rpt-detail-body p{margin:6px 0}
.rpt-detail-body ul{margin:6px 0 10px;padding-left:1.3em}
.rpt-detail-body li{margin:4px 0}
.rpt-detail-body a{color:var(--accent)}
.rpt-form{display:grid;gap:12px;margin:0 0 24px}
.rpt-form label{display:grid;gap:4px;font-size:.85rem;font-weight:700}
.rpt-form input[type=text],.rpt-form textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:400}
.rpt-form textarea{min-height:260px;line-height:1.6;resize:vertical}
.rpt-form .chk{display:flex;align-items:center;gap:8px;font-weight:400}
.rpt-hint{font-size:.78rem;color:var(--muted);font-weight:400}
.rpt-prev{border:1px dashed var(--line);border-radius:10px;padding:12px 16px}
.join-step{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px 18px;margin:0 0 14px}
.join-step h2{font-size:1rem;margin:0 0 10px}
#join-state{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.9rem}
.join-ok{color:var(--accent)}
.join-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:6px 0}
</style>
</head>
